; PlatformIO Project Configuration File (Root launcher for CYD-Klipper)
[platformio]
default_envs = freenove-esp32s3-display-28-lcd
src_dir = CYD-Klipper/src
include_dir = CYD-Klipper/include
boards_dir = CYD-Klipper/boards
lib_dir = CYD-Klipper/lib

[env]
platform = espressif32@6.4.0
board = esp32dev
framework = arduino
monitor_speed = 115200
debug_build_flags = -Os
lib_deps =
	bblanchon/ArduinoJson@^7.0.0
	plageoj/UrlEncode@^1.0.1
	knolleary/PubSubClient@^2.8
	WiFiClientSecure
monitor_filters = esp32_exception_decoder
extra_scripts =
	pre:CYD-Klipper/extract_commit.py
build_flags =
	-DLV_CONF_PATH="../../../../CYD-Klipper/src/conf/lv_conf.h"

[env:freenove-esp32s3-display-28-lcd]
board = esp32-s3-freenove-28c
lib_deps =
	SPI
	Wire
	https://github.com/suchmememanyskill/lvgl
	https://github.com/Bodmer/TFT_eSPI.git
	bblanchon/ArduinoJson@^7.0.0
	plageoj/UrlEncode@^1.0.1
	knolleary/PubSubClient@^2.8
	WiFiClientSecure

[env:freenove-esp32-s3-28]
board = esp32-s3-freenove-28c
lib_deps =
	SPI
	Wire
	https://github.com/suchmememanyskill/lvgl
	https://github.com/Bodmer/TFT_eSPI.git
	bblanchon/ArduinoJson@^7.0.0
	plageoj/UrlEncode@^1.0.1
	knolleary/PubSubClient@^2.8
	WiFiClientSecure
